[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch"
version = "0.1.0"
description = "F1 race strategy optimization under safety-car uncertainty"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.3",
    "pandas>=2.1",
    "numpy>=1.26,<2.5",
    "pyarrow>=14.0",
    "requests>=2.31",
    "statsmodels>=0.14",
    "ortools>=9.15",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
    "httpx2>=2.0",
]

[tool.setuptools.packages.find]
include = ["modeling*", "scripts*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
