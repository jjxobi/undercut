name: weekly refresh

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/refresh.py
      - name: commit updated data if it changed
        run: |
          git config user.name "Jesse O'Brien"
          git config user.email "jesob5@gmail.com"
          git add data/processed/
          git diff --cached --quiet && exit 0
          git commit -m "weekly data refresh"
          git push
