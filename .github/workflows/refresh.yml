name: weekly refresh

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: get iso week
        id: date
        run: echo "week=$(date +%GW%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw/fastf1_cache/
          key: fastf1-cache-${{ steps.date.outputs.week }}
          restore-keys: |
            fastf1-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/refresh.py
      - name: commit updated data if it changed
        run: |
          git config user.name "Jesse O'Brien"
          git config user.email "jesob5@gmail.com"
          git add data/processed/
          git diff --cached --quiet && exit 0
          git commit -m "weekly data refresh"
          git push
